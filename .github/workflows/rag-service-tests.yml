name: RAG service tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, upgrade/rag-service-api]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"
      GOOGLE_API_KEY: ""

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-service.txt reportlab

      - name: Run offline test suite
        run: python -m unittest discover -s tests -v